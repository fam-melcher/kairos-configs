#cloud-config
# Cluster fragment — CLUSTER-SPECIFIC (ADR 0012): every cluster carries its
# own copy of this file under clusters/<name>/config/.
#
# Cluster-wide settings for every node of this environment. K3s options go
# through its config drop-in directory so the role fragments stay free of
# cluster values and remain shared.

stages:
  initramfs:
    - name: "K3s environment configuration"
      files:
        - path: /etc/rancher/k3s/config.yaml.d/10-env.yaml
          permissions: 0600
          owner: 0
          group: 0
          content: |
            tls-san:
              - 192.168.30.2
              - k8s-prod.home.fam-melcher.net
    # The routed path into this network carries less than 1500 bytes; the
    # DHCP server announces the effective MTU via option 26. networkd
    # ignores that option unless told otherwise — without this, large
    # packets from and to other networks are dropped silently.
    - name: "Honor DHCP-provided MTU"
      files:
        - path: /etc/systemd/network/20-dhcp.network.d/10-mtu.conf
          permissions: 0644
          owner: 0
          group: 0
          content: |
            [DHCP]
            UseMTU=true
        - path: /etc/systemd/network/20-dhcp-legacy.network.d/10-mtu.conf
          permissions: 0644
          owner: 0
          group: 0
          content: |
            [DHCP]
            UseMTU=true
