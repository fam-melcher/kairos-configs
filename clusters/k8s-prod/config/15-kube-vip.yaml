#cloud-config
# Cluster fragment — CLUSTER-SPECIFIC (ADR 0012): kube-vip in ARP mode providing the control plane VIP
# 192.168.30.2 (ADR 0006). Deployed via the K3s auto-deploy manifest
# directory; K3s applies it without manual kubectl steps.
#
# Deliberately not using the native Kairos `kubevip:` block: provider-kairos
# only deploys kube-vip in p2p coordination mode (internal/role/p2p/master.go),
# which this repository does not use (see ADR 0006).
#
# The boot stage runs on every boot and rewrites the same file (idempotent).

stages:
  boot:
    - name: "Install kube-vip auto-deploy manifest"
      files:
        - path: /var/lib/rancher/k3s/server/manifests/kube-vip.yaml
          permissions: 0600
          owner: 0
          group: 0
          content: |
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: kube-vip
              namespace: kube-system
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: system:kube-vip-role
            rules:
              - apiGroups: [""]
                resources: ["services/status"]
                verbs: ["update"]
              - apiGroups: [""]
                resources: ["services", "endpoints"]
                verbs: ["list", "get", "watch", "update"]
              - apiGroups: [""]
                resources: ["nodes"]
                verbs: ["list", "get", "watch", "update", "patch"]
              - apiGroups: ["coordination.k8s.io"]
                resources: ["leases"]
                verbs: ["list", "get", "watch", "update", "create"]
              - apiGroups: ["discovery.k8s.io"]
                resources: ["endpointslices"]
                verbs: ["list", "get", "watch"]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: system:kube-vip-binding
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: system:kube-vip-role
            subjects:
              - kind: ServiceAccount
                name: kube-vip
                namespace: kube-system
            ---
            apiVersion: apps/v1
            kind: DaemonSet
            metadata:
              name: kube-vip
              namespace: kube-system
            spec:
              selector:
                matchLabels:
                  app.kubernetes.io/name: kube-vip
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: kube-vip
                spec:
                  serviceAccountName: kube-vip
                  hostNetwork: true
                  nodeSelector:
                    node-role.kubernetes.io/control-plane: "true"
                  tolerations:
                    - effect: NoSchedule
                      key: node-role.kubernetes.io/control-plane
                      operator: Exists
                    - effect: NoExecute
                      key: node-role.kubernetes.io/etcd
                      operator: Exists
                  containers:
                    - name: kube-vip
                      image: ghcr.io/kube-vip/kube-vip:v1.2.1
                      imagePullPolicy: IfNotPresent
                      args: ["manager"]
                      env:
                        - name: address
                          value: "192.168.30.2"
                        - name: port
                          value: "6443"
                        - name: vip_arp
                          value: "true"
                        - name: vip_cidr
                          value: "32"
                        - name: cp_enable
                          value: "true"
                        - name: svc_enable
                          value: "false"
                        - name: vip_leaderelection
                          value: "true"
                        - name: vip_leaseduration
                          value: "5"
                        - name: vip_renewdeadline
                          value: "3"
                        - name: vip_retryperiod
                          value: "1"
                      securityContext:
                        capabilities:
                          add: ["NET_ADMIN", "NET_RAW"]
