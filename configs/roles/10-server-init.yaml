#cloud-config
# Role fragment: first K3s server — initialises the embedded etcd cluster.
# Used by exactly one node per cluster (ADR 0006); all other servers use
# 10-server-join.yaml. The cluster token is injected at dispatch time as
# /oem/30-k3s-token.yaml (ADR 0008) and never lives in this file.

k3s:
  enabled: true
  args:
    - --cluster-init
    - --disable=traefik
    - --disable=servicelb
    - --tls-san=192.168.1.11
