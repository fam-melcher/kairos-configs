#cloud-config
# ArgoCD bootstrap (ADR 0015; installation mechanism corrected — ADR 0017).
# BOOTSTRAP-ROLE: installer-selected — never reference from fragments.list.
#
# Fetched by iso/dispatch.sh only in the genesis branch (mirrors
# configs/cluster/13-join.yaml's join-only fetch) — only the node that
# initialises the cluster needs to stage this; once applied, the
# resulting objects live in the cluster's own etcd and every later node
# sees them through the API (same reasoning ADR 0006 already relies on
# for kube-vip).
#
# One-shot (ADR 0016 sentinel pattern). Applies ArgoCD's own official
# install manifest directly via `kubectl apply --server-side` — the exact
# mechanism ArgoCD's getting-started guide documents (verified, not
# assumed: https://argo-cd.readthedocs.io/en/stable/getting_started/) —
# instead of a persistent k3s HelmChart CR. A HelmChart CR is a standing,
# continuously-reconciling controller; once ArgoCD's own Application took
# over managing that same release afterward, it became a second, live,
# permanent owner of the same objects with no clean way to retire it
# (ADR 0017 — reproduced live: a stuck retirement hook Job left the
# release stuck mid-handoff, then a forced recovery attempt caused ArgoCD
# to prune its own entire installation with nothing left to bootstrap it
# back). Applying the install manifest once, directly, leaves nothing
# behind to retire — there is no second owner to begin with.
#
# ServerSideApply is required here for the same reason ArgoCD's own docs
# require it once self-management takes over (some of these CRDs exceed
# client-side apply's 262KB last-applied-configuration annotation limit).
#
# kairos-gitops is public — no repo credential needed (ADR 0015).

stages:
  boot:
    - name: "Bootstrap ArgoCD (one-shot)"
      if: '[ ! -f /oem/.rendered-16-argocd ]'
      files:
        - path: /etc/kairos-cluster/argocd-root.yaml.tmpl
          permissions: 0644
          owner: 0
          group: 0
          content: |
            apiVersion: argoproj.io/v1alpha1
            kind: Application
            metadata:
              name: root
              namespace: argocd
            spec:
              project: default
              source:
                repoURL: "@GITOPS_REPO@"
                targetRevision: HEAD
                path: "@GITOPS_PATH@"
              destination:
                server: https://kubernetes.default.svc
                namespace: argocd
              syncPolicy:
                automated:
                  prune: true
                  selfHeal: true
                syncOptions:
                  - CreateNamespace=true
      commands:
        - |
          . /etc/kairos-cluster/cluster.env
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

          # k3s.service's readiness relative to this boot stage isn't
          # guaranteed — wait for the API server instead of assuming it's
          # already up. Bounded (5 min) per the same "hooks/workloads need
          # a deadline" reasoning ADR 0017 documents.
          _attempt=1
          until kubectl get --raw /healthz > /dev/null 2>&1; do
              if [ "${_attempt}" -ge 150 ]; then
                  echo "argocd bootstrap: kube-apiserver never became reachable" >&2
                  exit 1
              fi
              _attempt=$((_attempt + 1))
              sleep 2
          done

          kubectl create namespace argocd --dry-run=client -o yaml \
              | kubectl apply --server-side --force-conflicts -f -

          # Pinned to the tag kairos-gitops's own "argocd" Application
          # targets too (its version-patch.yaml, per cluster) — no version
          # drift the instant self-management takes over. Checksum
          # verified against the real published file before use.
          argocd_install_url="https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.5/manifests/install.yaml"
          argocd_install_sha256="cdf6758b489d25641c2a1fd835642543aaa64fe530867d0136a83ddf3dafe456"
          argocd_install_file="$(mktemp)"
          curl -fsSL "${argocd_install_url}" -o "${argocd_install_file}"
          echo "${argocd_install_sha256}  ${argocd_install_file}" | sha256sum -c - \
              || { echo "argocd bootstrap: install manifest checksum mismatch" >&2; exit 1; }
          kubectl apply --server-side --force-conflicts -n argocd -f "${argocd_install_file}"
          rm -f "${argocd_install_file}"

          # root's very first comparison races repo-server's own startup
          # otherwise — reproduced live: applying root ~3s after the
          # install manifest hit "connection refused" against repo-server,
          # and the resulting ComparisonError sat there uncorrected for
          # over two minutes (Argo's own selfHeal did not retry it on its
          # own; a manual hard-refresh was needed to unstick it).
          #
          # Wait on the Deployment's rollout, not `kubectl wait ... pod
          # -l ...`: that command only waits for a POD matching the
          # selector to reach a condition — if zero pods match yet (the
          # Deployment controller hasn't created one, which is the normal
          # state immediately after apply) it fails instantly rather than
          # waiting for one to be created. Reproduced live on a real
          # 3-node reinstall: the wait failed within the same second as
          # the apply, this whole stage exited on it, and root was never
          # applied on any of the 3 nodes. The Deployment object itself is
          # guaranteed to exist immediately after apply, so waiting on its
          # rollout has nothing to race.
          kubectl rollout status deployment/argocd-repo-server -n argocd --timeout=300s \
              || { echo "argocd bootstrap: repo-server never became ready" >&2; exit 1; }

          sed -e "s|@GITOPS_REPO@|${GITOPS_REPO}|g" -e "s|@GITOPS_PATH@|${GITOPS_PATH}|g" \
              /etc/kairos-cluster/argocd-root.yaml.tmpl \
              | kubectl apply --server-side --force-conflicts -f -

          touch /oem/.rendered-16-argocd
