#cloud-config
# Value-free and shared by all clusters (ADR 0013): the manifest is staged
# as a template with a literal @VIP@ token; the VIP renders at boot from
# /etc/kairos-cluster/cluster.env (written in initramfs by the cluster's
# 11-cluster.yaml — the boot stage runs strictly afterwards).
# kube-vip in ARP mode providing the control plane VIP
# @VIP@ (ADR 0006). Deployed via the K3s auto-deploy manifest
# directory; K3s applies it without manual kubectl steps.
#
# Deliberately not using the native Kairos `kubevip:` block: provider-kairos
# only deploys kube-vip in p2p coordination mode (internal/role/p2p/master.go),
# which this repository does not use (see ADR 0006).
#
# One-shot (ADR 0014): staging the manifest once is enough — K3s's
# auto-deploy controller applies it cluster-wide as a normal k8s resource,
# so every node listing this fragment redundantly applying the same
# content on its own first boot is harmless. Re-applying from this file on
# every later boot is not: it would silently revert any VIP change an
# operator makes on the live DaemonSet. Deletes its own /oem fragment
# after the first apply.

stages:
  boot:
    - name: "Stage kube-vip manifest template"
      files:
        - path: /etc/kairos-cluster/kube-vip.yaml.tmpl
          permissions: 0600
          owner: 0
          group: 0
          content: |
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: kube-vip
              namespace: kube-system
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRole
            metadata:
              name: system:kube-vip-role
            rules:
              - apiGroups: [""]
                resources: ["services/status"]
                verbs: ["update"]
              - apiGroups: [""]
                resources: ["services", "endpoints"]
                verbs: ["list", "get", "watch", "update"]
              - apiGroups: [""]
                resources: ["nodes"]
                verbs: ["list", "get", "watch", "update", "patch"]
              - apiGroups: ["coordination.k8s.io"]
                resources: ["leases"]
                verbs: ["list", "get", "watch", "update", "create"]
              - apiGroups: ["discovery.k8s.io"]
                resources: ["endpointslices"]
                verbs: ["list", "get", "watch"]
            ---
            apiVersion: rbac.authorization.k8s.io/v1
            kind: ClusterRoleBinding
            metadata:
              name: system:kube-vip-binding
            roleRef:
              apiGroup: rbac.authorization.k8s.io
              kind: ClusterRole
              name: system:kube-vip-role
            subjects:
              - kind: ServiceAccount
                name: kube-vip
                namespace: kube-system
            ---
            apiVersion: apps/v1
            kind: DaemonSet
            metadata:
              name: kube-vip
              namespace: kube-system
            spec:
              selector:
                matchLabels:
                  app.kubernetes.io/name: kube-vip
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: kube-vip
                spec:
                  serviceAccountName: kube-vip
                  hostNetwork: true
                  nodeSelector:
                    node-role.kubernetes.io/control-plane: "true"
                  tolerations:
                    - effect: NoSchedule
                      key: node-role.kubernetes.io/control-plane
                      operator: Exists
                    - effect: NoExecute
                      key: node-role.kubernetes.io/etcd
                      operator: Exists
                  containers:
                    - name: kube-vip
                      image: ghcr.io/kube-vip/kube-vip:v1.2.1
                      imagePullPolicy: IfNotPresent
                      args: ["manager"]
                      env:
                        - name: address
                          value: "@VIP@"
                        - name: port
                          value: "6443"
                        - name: vip_arp
                          value: "true"
                        - name: vip_cidr
                          value: "32"
                        - name: cp_enable
                          value: "true"
                        - name: svc_enable
                          value: "false"
                        - name: vip_leaderelection
                          value: "true"
                        - name: vip_leaseduration
                          value: "5"
                        - name: vip_renewdeadline
                          value: "3"
                        - name: vip_retryperiod
                          value: "1"
                      securityContext:
                        capabilities:
                          add: ["NET_ADMIN", "NET_RAW"]
    - name: "Render kube-vip manifest"
      commands:
        - |
          . /etc/kairos-cluster/cluster.env
          umask 077
          mkdir -p /var/lib/rancher/k3s/server/manifests
          sed "s|@VIP@|${VIP}|g" /etc/kairos-cluster/kube-vip.yaml.tmpl \
              > /var/lib/rancher/k3s/server/manifests/kube-vip.yaml
          rm -f /oem/15-kube-vip.yaml
