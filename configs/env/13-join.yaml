#cloud-config
# BOOTSTRAP-ROLE: installer-selected (ADR 0011) — never reference from fragments.list
#
# Environment fragment — BRANCH-SPECIFIC (ADR 0009).
#
# Join target for servers joining the existing cluster. Fetched by the
# installer's dispatcher together with 10-server-join.yaml (ADR 0011) — a
# cluster-init node must not carry a server entry, so this file must never
# appear in a fragments.list.

stages:
  initramfs:
    - name: "K3s join target"
      files:
        - path: /etc/rancher/k3s/config.yaml.d/20-join.yaml
          permissions: 0600
          owner: 0
          group: 0
          content: |
            server: https://192.168.30.2:6443
