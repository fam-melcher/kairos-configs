name: validate

on:
  pull_request:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository invariants (ADR 0011)
        run: scripts/validate-nodes.sh

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kairos-status.sh embedded in 00-base.yaml matches source
        run: |
          scripts/render-base-fragment.sh
          git diff --exit-code -- configs/base/00-base.yaml

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: reviewdog/action-shellcheck@v1
        with:
          github_token: ${{ secrets.github_token }}
          reporter: github-pr-review
          filter_mode: added
          fail_level: any
