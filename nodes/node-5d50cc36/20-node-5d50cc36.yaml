#cloud-config
# Node-specific fragment. Copy to nodes/<hostname>/20-<hostname>.yaml and
# replace every @VARIABLE@ placeholder (grep '@' must return nothing).

hostname: "node-5d50cc36"

# Uncomment and adjust for static addressing; omit for DHCP.
# stages:
#   initramfs:
#     - name: "Static network configuration"
#       commands:
#         - nmcli con mod "Wired connection 1" ipv4.method manual \
#             ipv4.addresses @NODE_IP@/@NODE_PREFIX@ \
#             ipv4.gateway @NODE_GATEWAY@ ipv4.dns "@NODE_DNS@"

stages:
  boot:
    - name: "Set Power On After Power Loss"
      files:
        - path: /usr/local/bin/set-power-on-loss.sh
          permissions: 0755
          owner: 0
          group: 0
          content: |
            #!/bin/bash
            # Set AFTERG3_EN (bit 0) in GEN_PMCON_3 register (LPC-Bridge PCI 00:1f.0, offset 0xa4).
            # sysfs-only implementation with read-modify-write to preserve other bits.
            set -euo pipefail

            PCI_SLOT="00:1f.0"
            PCI_OFFSET="0xa4"

            # Find device directory (sysfs uses domain:bus:slot.func format, e.g., 0000:00:1f.0)
            SYSFS_DIR=$(find /sys/devices -name "*:$PCI_SLOT" -type d 2>/dev/null | head -1)
            if [[ -z "$SYSFS_DIR" ]]; then
              echo "ERROR: PCI device $PCI_SLOT not found in sysfs" >&2
              exit 1
            fi

            CONFIG_PATH="$SYSFS_DIR/config"
            if [[ ! -w "$CONFIG_PATH" ]]; then
              echo "ERROR: $CONFIG_PATH not writable" >&2
              exit 1
            fi

            # Read current byte at offset
            OFFSET=$((PCI_OFFSET))
            CURRENT=$(dd if="$CONFIG_PATH" bs=1 count=1 skip=$OFFSET | od -An -tx1 | tr -d ' ')
            if [[ -z "$CURRENT" || ${#CURRENT} -ne 2 ]]; then
              echo "ERROR: Failed to read offset $PCI_OFFSET" >&2
              exit 1
            fi

            # Check if bit 0 already set
            if (( (0x$CURRENT & 0x01) != 0 )); then
              echo "Power-On-After-Loss already set"
              exit 0
            fi

            # Set bit 0 via read-modify-write (preserve other bits)
            NEW=$(( 0x$CURRENT | 0x01 ))
            NEW_HEX=$(printf '%02x' $NEW)
            printf "\\x$NEW_HEX" | dd of="$CONFIG_PATH" bs=1 count=1 seek=$OFFSET conv=notrunc

            # Verify the write succeeded
            VERIFY=$(dd if="$CONFIG_PATH" bs=1 count=1 skip=$OFFSET | od -An -tx1 | tr -d ' ')
            if [[ -z "$VERIFY" || ${#VERIFY} -ne 2 ]]; then
              echo "ERROR: Failed to verify write" >&2
              exit 1
            fi

            if (( (0x$VERIFY & 0x01) == 0 )); then
              echo "ERROR: Bit 0 still not set after write (read back: 0x$VERIFY)" >&2
              exit 1
            fi

            echo "Power-On-After-Loss successfully set (0x$CURRENT → 0x$NEW_HEX)"
            exit 0
        - path: /etc/systemd/system/power-on-after-loss.service
          permissions: 0644
          owner: 0
          group: 0
          content: |
            [Unit]
            Description=Set "Power On After Power Loss" in LPC-Bridge PCI config

            [Service]
            Type=oneshot
            ExecStart=/usr/local/bin/set-power-on-loss.sh
            StandardOutput=journal
            StandardError=journal

            [Install]
            WantedBy=multi-user.target
      commands:
        - systemctl daemon-reload
        - systemctl enable power-on-after-loss.service

install:
  # Target disk for this machine, e.g. /dev/nvme0n1 or /dev/sda.
  device: "/dev/sda"
